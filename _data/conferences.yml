# AI conference deadlines (ML / NLP / CV), from github.com/ccfddl/ccf-deadlines
# deadline_utc is the absolute instant; the page counts down to it in the browser,
# so the countdown is live on every visit without rebuilding the site.
#
# status: confirmed = date published by the venue
