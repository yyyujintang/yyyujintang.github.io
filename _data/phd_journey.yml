# Successful PhD Journey — resources rendered on /phd-journey.html
#
# To add a resource, append an entry under a section's `items`.
# It renders as "<title> by <author>", with the title linking to url:
#   - title:  "Resource title"
#     url:    https://...
#     author: "Who wrote it (affiliation)"
#
# A section with no items shows "More coming soon." — delete a section to hide it.

sections:
